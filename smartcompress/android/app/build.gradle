plugins {
    id 'com.android.application'
}

android {
    namespace 'com.smartcompress.app'
    compileSdk 35

    buildFeatures { buildConfig true }

    defaultConfig {
        applicationId 'com.smartcompress.app'
        minSdk 23
        targetSdk 35
        versionCode 3
        versionName '1.1.1'
        def home = project.findProperty('smartcompressHome') ?: 'https://smartcompress-8eq6.onrender.com/'
        if (!home.startsWith('https://') || home.contains('"') || home.contains('\\')) {
            throw new GradleException('smartcompressHome must be an HTTPS URL')
        }
        buildConfigField 'String', 'SMARTCOMPRESS_HOME', '"' + home + '"'
    }
}
