[project]
name = "smartcompress"
version = "1.0.0"
description = "Format-aware file compression web service"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "python-multipart>=0.0.12",
  "Pillow>=11.0,<14",
  "PyMuPDF>=1.24,<2",
]

[dependency-groups]
dev = [
  "pytest>=8,<10",
  "httpx>=0.27,<1",
]

[tool.uv]
package = false
